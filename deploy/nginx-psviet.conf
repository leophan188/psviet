# Nginx ở server ngoài (giữ cổng 80/443): chuyển tên miền psviet.com vào máy ảo chạy web, cổng 8888.
# Đặt vào /etc/nginx/sites-available/psviet.conf, tạo link sang sites-enabled, rồi:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d psviet.com -d www.psviet.com     # cấp HTTPS miễn phí, tự gia hạn
# Máy ảo khác: chép file này, đổi server_name và IP trong proxy_pass.

server {
    listen 80;
    server_name psviet.com www.psviet.com;

    client_max_body_size 4g;          # trang quản trị tải video lên tới 4GB
    proxy_request_buffering off;      # đẩy thẳng file lớn sang máy ảo, không đệm ra đĩa
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://192.168.9.202:8888;
        proxy_set_header Host $host;  # bắt buộc: web kiểm tra Origin khớp Host (đăng nhập, lưu dữ liệu)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # để thống kê lấy đúng IP khách
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
