<main class="admin-page">
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="assets/brand/psviet-mark-192.png" alt="" width="56" height="56">
      <h1>Đăng nhập quản trị</h1>
      <p class="muted">PSVIET.COM</p>
      <label for="login-pw">Mật khẩu</label>
      <input id="login-pw" type="password" autocomplete="current-password" required>
      <p id="login-err" class="form-err" role="alert"></p>
      <button class="btn primary lg" type="submit">Đăng nhập</button>
    </form>
  </section>

  <div id="app" class="admin-app" hidden>
    <aside class="admin-side" id="admin-side">
      <a class="side-brand" href="index.html"><img src="assets/brand/psviet-mark-192.png" alt="" width="34" height="34"><span>PSVIET<em>.COM</em></span><small>Quản trị</small></a>
      <nav id="admin-nav" aria-label="Mục quản trị"></nav>
      <div class="side-foot">
        <a class="side-link" href="index.html" target="_blank" rel="noopener"><svg class="i" aria-hidden="true"><use href="#i-external"/></svg>Xem website</a>
        <button class="side-link theme-toggle" type="button" aria-label="Chuyển giao diện sáng/tối"><svg class="i i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="i i-sun" aria-hidden="true"><use href="#i-sun"/></svg>Giao diện sáng/tối</button>
        <button class="side-link danger" type="button" id="btn-logout" hidden><svg class="i" aria-hidden="true"><use href="#i-logout"/></svg>Đăng xuất</button>
      </div>
    </aside>
    <div class="side-scrim" id="side-scrim"></div>
    <section class="admin-main">
      <div class="admin-top">
        <button class="side-toggle" type="button" id="side-open" aria-label="Mở menu quản trị"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <div class="admin-title"><h1 id="sec-title"></h1><p id="sec-hint" class="muted"></p></div>
        <div class="admin-top-actions">
          <span id="save-state" class="save-state"></span>
          <button class="btn outline sm" type="button" id="btn-discard" hidden>Bỏ thay đổi</button>
          <button class="btn primary" type="button" id="btn-publish"></button>
        </div>
      </div>
      <div id="static-note" class="notice" hidden><svg class="i" aria-hidden="true"><use href="#i-zap"/></svg><span>Đang mở trang quản trị không qua server nên <b>không có đăng nhập</b> và không đăng trực tiếp được. Chạy <code>python3 server.py</code> để đăng nhập, tải ảnh lên và bấm đăng là website cập nhật ngay.</span></div>
      <div id="view"></div>
    </section>
  </div>
</main>

<dialog id="editor" class="editor" aria-labelledby="editor-title">
  <form id="editor-form">
    <header class="editor-head"><h2 id="editor-title"></h2><button class="picker-close" type="button" id="editor-close" aria-label="Đóng"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></header>
    <div id="editor-fields" class="form-grid editor-body"></div>
    <p id="editor-err" class="form-err" role="alert"></p>
    <footer class="editor-foot"><button class="btn outline" type="button" id="editor-cancel">Hủy</button><button class="btn primary" type="submit"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Lưu</button></footer>
  </form>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="data.js"></script>
<script src="site.js"></script>
<script src="admin.js"></script>
<script src="admin-marketing.js"></script>
</body>
</html>
